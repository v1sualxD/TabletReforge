name: Publish TabletReforge v0.6.9

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-publish:
    if: github.event.head_commit.message == 'Publish TabletReforge v0.6.9'
    runs-on: windows-2022
    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Compile plugin
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\\Microsoft Visual Studio\\Installer\\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw 'Visual C++ build tools missing' }
          & "$vs\\MSBuild\\Current\\Bin\\MSBuild.exe" TabletReforge.sln /m /p:Configuration=Release /p:Platform=x64
          if ($LASTEXITCODE -ne 0) { throw 'Plugin build failed' }

      - name: Package plugin
        shell: pwsh
        run: |
          $destination = 'package/Plugins/TabletReforge'
          New-Item -ItemType Directory -Force $destination | Out-Null
          Copy-Item x64/Release/Plugins/TabletReforge/TabletReforge.dll $destination
          Copy-Item LICENSE, README.md $destination
          Compress-Archive -Path package/Plugins -DestinationPath TabletReforge.zip -Force

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create v0.6.9 TabletReforge.zip --title "TabletReforge v0.6.9" --target "$env:GITHUB_SHA" --notes "Automatic stash-to-bench tablet reforging. Opens the stash, selects the Tablet tab and Tablets section, skips ineligible and Sanctified tablets, reforges matching trios, and returns the results."
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publishing failed' }
