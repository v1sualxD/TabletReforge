name: Build and publish TabletReforge v0.7.1

on:
  pull_request:
    types:
      - opened
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

jobs:
  build-and-publish:
    if: github.event.pull_request.head.ref == 'codex/release-v0.7.1' && github.event.pull_request.title == 'Release TabletReforge v0.7.1' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-2022
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Compile plugin
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw 'Visual C++ build tools missing' }
          & "$vs\MSBuild\Current\Bin\MSBuild.exe" TabletReforge.sln /m /p:Configuration=Release /p:Platform=x64
          if ($LASTEXITCODE -ne 0) { throw 'Plugin build failed' }

      - name: Package plugin
        shell: pwsh
        run: |
          $destination = 'package/Plugins/TabletReforge'
          New-Item -ItemType Directory -Force $destination | Out-Null
          Copy-Item x64/Release/Plugins/TabletReforge/TabletReforge.dll $destination
          Copy-Item LICENSE, README.md $destination
          Compress-Archive -Path package/Plugins -DestinationPath TabletReforge.zip -Force

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create v0.7.1 TabletReforge.zip --title "TabletReforge v0.7.1" --target "${{ github.event.pull_request.head.sha }}" --notes "Fixes stash inventory rescan handling and waits between stash and Reforging Bench interactions. The automatic start closes its focused POEFixer window with Esc when possible."
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publishing failed' }
