name: Build TabletReforge
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Compile plugin and run planner tests
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw 'Visual C++ build tools missing' }
          & "$vs\MSBuild\Current\Bin\MSBuild.exe" TabletReforge.sln /m /p:Configuration=Release /p:Platform=x64
          if ($LASTEXITCODE -ne 0) { throw 'Plugin build failed' }
          $devcmd = "$vs\Common7\Tools\VsDevCmd.bat"
          $testCommand = '"' + $devcmd + '" -arch=x64 -host_arch=x64 && cl /nologo /std:c++20 /EHsc /W4 /Fe:work-tests.exe tests\ReforgePlanTests.cpp && work-tests.exe'
          & cmd.exe /d /s /c $testCommand
          if ($LASTEXITCODE -ne 0) { throw 'Planner tests failed' }
          $filterCommand = '"' + $devcmd + '" -arch=x64 -host_arch=x64 && cl /nologo /std:c++20 /EHsc /W4 /Fe:work-filter-tests.exe tests\ReforgeFilterTests.cpp && work-filter-tests.exe'
          & cmd.exe /d /s /c $filterCommand
          if ($LASTEXITCODE -ne 0) { throw 'Filter tests failed' }
      - name: Package plugin
        shell: pwsh
        run: |
          $destination = 'package/Plugins/TabletReforge'
          New-Item -ItemType Directory -Force $destination | Out-Null
          Copy-Item x64/Release/Plugins/TabletReforge/TabletReforge.dll $destination
          Copy-Item Plugins/TabletReforge/lang $destination -Recurse
          Copy-Item LICENSE, AUTOREFORGE-FR.md $destination
          Compress-Archive -Path package/Plugins -DestinationPath TabletReforge.zip
      - uses: actions/upload-artifact@v4
        with:
          name: TabletReforge
          path: TabletReforge.zip
